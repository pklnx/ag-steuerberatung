name: Build and publish Docker image

# The container image is the only way this site ships. Every push to main
# publishes a new image to the GitHub Container Registry, which the server then
# pulls: ghcr.io/pklnx/garrell-steuerberatung:latest
#
# Pull requests build the image as well but do not push it — since there is no
# second deploy path left, a Dockerfile that no longer builds has to be caught
# before it reaches main.
#
# The weekly schedule is what keeps nginx and the Alpine packages current: the
# image is pure COPY on top of the unpinned nginx:alpine, so rebuilding an
# unchanged commit picks up whatever mainline release that tag points at today.
# Without it a site that nobody edits would keep serving the nginx of its last
# content edit.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    # Mondays 04:00 UTC. GitHub disables scheduled workflows after 60 days
    # without repository activity — with the base image unpinned, the Dependabot
    # action updates are the only commits that keep this one alive on a site
    # that goes months without a content change.
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  # The event name is part of the group on purpose: schedule and push both run
  # on refs/heads/main, so without it a Monday rebuild would cancel a merge that
  # happens to be building at the same moment.
  group: docker-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The image is pure COPY, so arm64 (typical for small VPS instances)
      # costs almost nothing to build alongside amd64. PRs build amd64 only
      # and therefore need no emulation.
      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action stamps org.opencontainers.image.created with the current
      # build time. That changes the image config, and with it the manifest
      # digest, on every single rebuild — so an idle weekly run would look like
      # a new image to DIUN and produce a notification about nothing. Pinning
      # the label to the commit date makes an unchanged rebuild bit-identical,
      # and a DIUN notification then means something actually moved.
      - name: Read the commit date
        id: commit
        run: echo "date=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # sha- tags are not unique across rebuilds: a scheduled run builds the
          # same commit again and overwrites its sha- tag with a newer nginx.
          # The date tag is the stable anchor to roll back to.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYYMMDD'}},enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short
          labels: |
            org.opencontainers.image.created=${{ steps.commit.outputs.date }}

      # Build locally and actually run it before anything is published. With the
      # base image unpinned, a new nginx mainline arrives without warning — this
      # is what stands between a release that no longer accepts nginx.conf and
      # the registry.
      - name: Build test image (amd64, loadable)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          pull: true
          tags: garrell-steuerberatung:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the container and probe it
        run: |
          set -euo pipefail

          # Same hardening the compose file promises, so CI proves it holds.
          docker run -d --name smoke \
            --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -p 127.0.0.1:8080:8080 garrell-steuerberatung:test

          echo "::group::Wait for healthy"
          for _ in $(seq 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' smoke)
            [ "$status" = healthy ] && break
            if [ "$status" = unhealthy ]; then docker logs smoke; exit 1; fi
            sleep 1
          done
          if [ "$(docker inspect -f '{{.State.Health.Status}}' smoke)" != healthy ]; then
            echo "container never became healthy"; docker logs smoke; exit 1
          fi
          echo "::endgroup::"

          # Running as non-root? Otherwise redirecting the writable paths to
          # /tmp and the read-only root filesystem are pointless.
          test "$(docker exec smoke id -un)" = nginx
          echo "user: $(docker exec smoke id -un) (uid $(docker exec smoke id -u))"

          # Every page byte-for-byte what the repository holds.
          for page in index impressum datenschutz; do
            curl -fsS "http://127.0.0.1:8080/$page.html" -o "served-$page.html"
            diff -q "served-$page.html" "$page.html"
          done
          curl -fsS http://127.0.0.1:8080/ -o served-root.html
          diff -q served-root.html index.html

          # Clean URLs (try_files): /impressum has to serve impressum.html.
          curl -fsS http://127.0.0.1:8080/impressum -o served-clean.html
          diff -q served-clean.html impressum.html

          # The stylesheet and a font, so the CSP assertions below mean something.
          curl -fsS http://127.0.0.1:8080/card.css -o /dev/null
          curl -fsS -D font.txt -o /dev/null \
            http://127.0.0.1:8080/assets/fonts/source-sans-3-latin-400-normal.woff2
          grep -qi 'max-age=2592000' font.txt   # the 30d rule for /assets/fonts/

          # The liveness endpoint the HEALTHCHECK probes.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/healthz)" = 200

          echo "::group::Security headers"
          curl -fsS -D headers.txt -o /dev/null http://127.0.0.1:8080/
          cat headers.txt
          # The CSP enforces the no-external-requests rule the privacy policy
          # rests on. style-src must stay 'self': the moment it needs
          # 'unsafe-inline', someone put CSS back into the HTML.
          grep -qi "^content-security-policy:.*default-src 'none'" headers.txt
          grep -qi "^content-security-policy:.*style-src 'self'"   headers.txt
          if grep -qi "unsafe-inline" headers.txt; then
            echo "CSP allows inline styles — card.css is no longer the only stylesheet"; exit 1
          fi
          grep -qi '^x-content-type-options: nosniff' headers.txt
          grep -qi '^x-frame-options: DENY'           headers.txt
          grep -qi '^referrer-policy:'                headers.txt
          echo "::endgroup::"

          # Unknown paths 404, dotfiles are denied outright.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/nope)"    = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/.env)"    = 403

          echo "::group::Access log carries no client IP"
          # §4 of datenschutz.html promises this. nginx writes the access log to
          # stdout and the error log to stderr, and only the latter is allowed to
          # contain an address — so look at stdout alone.
          curl -fsS -A smoketest http://127.0.0.1:8080/ -o /dev/null
          docker logs smoke 2>/dev/null | tail -n 3 | tee access.log
          # The privacy format starts with the timestamp; "combined" would start
          # with $remote_addr.
          grep -qE '^\[' access.log
          if grep -qE '[0-9]{1,3}(\.[0-9]{1,3}){3}' access.log; then
            echo "access log contains an IP address — datenschutz.html §4 no longer holds"; exit 1
          fi
          echo "::endgroup::"

          echo "smoke test passed"
          docker rm -f smoke

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # Only main/tags need arm64; on a PR one architecture is enough to
          # prove the image still builds.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          # Re-resolve nginx:alpine on every build — without this the whole
          # point of the weekly schedule is lost to a cached base layer.
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
