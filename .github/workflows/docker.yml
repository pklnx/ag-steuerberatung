name: Build and publish Docker image

# The container image is the only way this site ships. Every push to main
# publishes a new image to the GitHub Container Registry, which the server then
# pulls: ghcr.io/pklnx/garrell-steuerberatung:latest
#
# Pull requests build the image as well but do not push it — since there is no
# second deploy path left, a Dockerfile that no longer builds has to be caught
# before it reaches main.
#
# The weekly schedule is what keeps nginx and the Alpine packages current: the
# image is pure COPY on top of nginx:1.30-alpine, so rebuilding an unchanged
# commit picks up whatever patch release that tag points at today. Without it a
# site that nobody edits would keep serving the nginx of its last content edit.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    # Mondays 04:00 UTC. GitHub disables scheduled workflows after 60 days
    # without repository activity — the Dependabot PRs are what keep this one
    # alive on a site that goes months without a content change.
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  # The event name is part of the group on purpose: schedule and push both run
  # on refs/heads/main, so without it a Monday rebuild would cancel a merge that
  # happens to be building at the same moment.
  group: docker-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The image is pure COPY, so arm64 (typical for small VPS instances)
      # costs almost nothing to build alongside amd64. PRs build amd64 only
      # and therefore need no emulation.
      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action stamps org.opencontainers.image.created with the current
      # build time. That changes the image config, and with it the manifest
      # digest, on every single rebuild — so an idle weekly run would look like
      # a new image to DIUN and produce a notification about nothing. Pinning
      # the label to the commit date makes an unchanged rebuild bit-identical,
      # and a DIUN notification then means something actually moved.
      - name: Read the commit date
        id: commit
        run: echo "date=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # sha- tags are not unique across rebuilds: a scheduled run builds the
          # same commit again and overwrites its sha- tag with a newer nginx.
          # The date tag is the stable anchor to roll back to.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYYMMDD'}},enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short
          labels: |
            org.opencontainers.image.created=${{ steps.commit.outputs.date }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Only main/tags need arm64; on a PR one architecture is enough to
          # prove the image still builds.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          # Re-resolve nginx:1.30-alpine on every build — without this the whole
          # point of the weekly schedule is lost to a cached base layer.
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
